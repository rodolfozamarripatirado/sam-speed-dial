<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g-azul" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f6cf0" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4f6cf0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="g-turquesa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ec9a7" stop-opacity="0.34" />
